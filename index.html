<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kochachan 🍅 Vegetable And Fruits 🍇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Manjari', sans-serif; transition: 0.3s; overflow-x: hidden; font-weight: 700; }
        
        .dark-mode { background-color: #020617 !important; color: #f8fafc; }
        .dark-mode .bg-slate-50 { background-color: #0f172a !important; }
        .dark-mode .bg-white { background-color: #1e293b !important; color: white !important; border-color: #334155; }
        .dark-mode .text-slate-800 { color: #f1f5f9 !important; }
        .dark-mode .text-green-600 { color: #4ade80 !important; }
        
        .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 15s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        #cartSidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .show-cart { transform: translateY(0) !important; }
        
        .item-img { width: 50px; height: 50px; object-fit: contain; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        
        /* Screenshot Watermark Style */
        #screenshotArea { 
            position: relative; 
            background: white;
            min-height: 400px;
        }
        #screenshotArea::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background-image: url('https://i.ibb.co/0j3zJmjy/file-00000000b43472089da4fc13d4ce1088.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.08; /* വല്ലാതെ തെളിഞ്ഞു കാണാതിരിക്കാൻ ഓപ്പാസിറ്റി കുറച്ചു */
            pointer-events: none;
        }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24" id="mainBody">

    <header class="bg-green-800 text-white p-4 shadow-lg sticky top-0 z-50 no-print">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-2">
            <div class="w-10"></div> 
            <div class="text-center">
                <h1 id="mainTitle" class="text-xl font-black tracking-tight leading-none uppercase">Kochachan 🥕 Veg & Fruits 🍎</h1>
                <div id="liveTime" class="text-[18px] font-black opacity-90 mt-1 uppercase"></div>
            </div>
            <button onclick="toggleDarkMode()" class="bg-green-700 h-10 w-10 rounded-lg flex items-center justify-center hover:bg-green-600">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="bg-yellow-400 overflow-hidden py-1 border-b border-yellow-500 shadow-inner no-print">
        <div class="animate-marquee">
            <span class="text-green-900 font-black text-sm uppercase tracking-wide">
            | ⚡ FAST DELIVERY | FRESH ITEMS | KOCHACHAN VEG & FRUITS 🍎
            </span>
        </div>
    </div>

    <main class="max-w-7xl mx-auto p-4">
        <div class="mb-4 no-print relative">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchInput" onkeyup="filterVeg()" placeholder="തിരയുക (Search)..." 
                class="w-full pl-12 p-3.5 rounded-2xl border-2 border-slate-200 outline-none focus:border-green-500 font-black text-slate-800 shadow-sm transition dark:bg-slate-800 dark:text-white dark:border-slate-600">
        </div>
        <div id="vegContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
    </main>

    <div id="bottomCartBar" class="fixed bottom-0 left-0 right-0 bg-green-700 text-white p-4 shadow-[0_-4px_15px_rgba(0,0,0,0.2)] z-[60] no-print flex justify-between items-center cursor-pointer" onclick="toggleCart()">
        <div class="flex items-center gap-3">
            <div id="cartIconContainer" class="bg-white/20 p-2 rounded-lg"><i class="fas fa-shopping-basket"></i></div>
            <div>
                <div class="font-black text-sm uppercase">ബില്ല് കാണാൻ ഇവിടെ അമർത്തുക</div>
                <div class="text-[11px] font-black opacity-80 uppercase"><span id="itemCount">0</span> Items</div>
            </div>
        </div>
        <div class="text-right">
            <div class="text-2xl font-black">₹<span id="grandTotal">0</span></div>
        </div>
    </div>

    <div id="cartSidebar" class="fixed inset-x-0 bottom-0 bg-white h-[90vh] rounded-t-[2.5rem] z-[70] transform translate-y-full flex flex-col no-print border-t shadow-2xl">
        <div class="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mt-3 mb-1"></div>
        <div class="px-6 py-4 border-b flex justify-between items-center">
            <span class="font-black text-xl text-slate-800">Your Bill</span>
            <div class="flex gap-3">
                <button onclick="takeScreenshot()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-black hover:bg-blue-700 transition">
                    <i class="fas fa-camera mr-2"></i>SAVE BILL
                </button>
                <button onclick="toggleCart()" class="text-slate-400 text-3xl"><i class="fas fa-times-circle"></i></button>
            </div>
        </div>

        <div id="screenshotArea" class="flex-1 overflow-y-auto p-4 bg-white">
            <div class="text-center mb-4 border-b-2 border-slate-100 pb-4">
                <h2 class="text-2xl font-black text-green-800 uppercase">Kochachan Veg & Fruits</h2>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Quality Guaranteed</p>
            </div>
            
            <div id="cartList" class="space-y-2"></div>
            
            <div id="billSummary" class="mt-6 p-4 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300">
                <div class="flex justify-between items-center">
                    <span class="font-black text-slate-600 uppercase text-xs">Grand Total</span>
                    <span class="font-black text-3xl text-green-700">₹<span id="sideTotal">0</span></span>
                </div>
                <div id="ssTimestamp" class="text-[10px] text-slate-400 font-black text-center mt-4 uppercase"></div>
            </div>
        </div>

        <div class="p-4 space-y-3 no-print bg-white dark:bg-slate-800">
            <button onclick="sendWhatsAppOrder()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black shadow-lg uppercase flex items-center justify-center gap-2 transition-all active:scale-95">
                <i class="fab fa-whatsapp text-2xl"></i> Send to WhatsApp
            </button>
            <button onclick="clearCart()" class="w-full py-2 text-red-500 font-black text-xs uppercase">Clear Everything</button>
        </div>
    </div>

    <div id="qtyModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-[110] backdrop-blur-sm p-4">
        <div class="bg-white p-6 rounded-3xl w-full max-w-xs shadow-2xl text-center">
            <div id="qtyImgContainer" class="mb-2"></div>
            <h3 id="qtyTitle" class="text-2xl font-black text-slate-800 uppercase"></h3>
            <p id="qtyTitleML" class="text-lg font-black text-green-600 mb-4"></p>
            <div class="text-xs font-bold text-slate-400 mb-1 uppercase">Enter Weight (kg)</div>
            <input type="number" id="qtyInput" class="w-full text-center text-4xl font-black p-4 bg-slate-100 rounded-2xl mb-4 outline-none border-2 border-transparent focus:border-green-500" value="1" step="0.01">
            <div class="grid grid-cols-4 gap-2 mb-6">
                <button onclick="setQty(0.1)" class="bg-slate-200 p-2 rounded-lg text-xs font-black">100g</button>
                <button onclick="setQty(0.25)" class="bg-slate-200 p-2 rounded-lg text-xs font-black">250g</button>
                <button onclick="setQty(0.5)" class="bg-slate-200 p-2 rounded-lg text-xs font-black">500g</button>
                <button onclick="setQty(1)" class="bg-slate-200 p-2 rounded-lg text-xs font-black">1kg</button>
            </div>
            <div class="flex gap-2">
                <button onclick="confirmAddToCart()" class="flex-1 bg-green-600 text-white py-4 rounded-2xl font-black text-xl">ADD</button>
                <button onclick="closeQtyModal()" class="flex-1 bg-slate-100 text-slate-500 py-4 rounded-2xl font-black">BACK</button>
            </div>
        </div>
    </div>

    <script>
        const vegetables = [
            {"id":1,"name":"Tomato","name_ml":"തക്കാളി","price":40,"image":"🍅"},
            {"id":2,"name":"Potato","name_ml":"ഉരുളക്കിഴങ്ങ്","price":45,"image":"🥔"},
            {"id":3,"name":"Onion","name_ml":"സവാള","price":55,"image":"🧅"},
            {"id":4,"name":"Carrot","name_ml":"കാരറ്റ്","price":60,"image":"🥕"},
            {"id":5,"name":"Cabbage","name_ml":"കാബേജ്","price":30,"image":"🥬"},
            {"id":6,"name":"Banana","name_ml":"വാഴപ്പഴം","price":50,"image":"🍌"},
            {"id":7,"name":"Mango","name_ml":"മാങ്ങ","price":120,"image":"🥭"},
            {"id":8,"name":"Brinjal","name_ml":"വഴുതന","price":45,"image":"🍆"},
            {"id":9,"name":"Ginger","name_ml":"ഇഞ്ചി","price":180,"image":"🫚"},
            {"id":10,"name":"Garlic","name_ml":"വെളുത്തുള്ളി","price":200,"image":"🧄"}
            // ... ബാക്കി ലിസ്റ്റ് പഴയതുപോലെ ചേർക്കാം
        ];

        let cart = [];
        let selectedVeg = null;

        function renderList() {
            const container = document.getElementById('vegContainer');
            container.innerHTML = vegetables.map((v, i) => `
            <div class="bg-white p-4 rounded-2xl text-center shadow-sm cursor-pointer flex flex-col justify-between active:scale-95 transition" onclick="openQtyModal(${i})">
                <div>
                    <div class="item-img">${v.image}</div>
                    <div class="font-black text-slate-800 text-xs uppercase">${v.name_ml}</div>
                    <div class="text-[10px] font-bold text-slate-400 uppercase">${v.name}</div>
                    <div class="text-green-600 font-black text-xl mt-1">₹${v.price}</div>
                </div>
            </div>
            `).join('');
        }

        function updateCartUI() {
            const total = cart.reduce((s, c) => s + c.total, 0);
            document.getElementById('itemCount').innerText = cart.length;
            document.getElementById('grandTotal').innerText = total.toFixed(2);
            document.getElementById('sideTotal').innerText = total.toFixed(2);
            
            const list = document.getElementById('cartList');
            if(cart.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-slate-300 font-black uppercase">No Items Added</div>`;
                return;
            }
            list.innerHTML = cart.map((item, i) => `
            <div class="flex justify-between items-center bg-white border-b border-slate-100 py-3">
                <div class="flex-1">
                    <div class="font-black text-slate-800 text-[15px] uppercase">${item.name}</div>
                    <div class="text-[11px] font-black text-slate-400">${item.qty}kg x ₹${item.price}</div>
                </div>
                <div class="flex items-center gap-4">
                    <span class="font-black text-green-700 text-lg">₹${item.total.toFixed(2)}</span>
                    <button onclick="event.stopPropagation(); cart.splice(${i},1); updateCartUI();" class="text-red-400 no-print"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>
            `).join('');
        }

        async function takeScreenshot() {
            if(cart.length === 0) return alert("Please add items to bill first!");
            
            const area = document.getElementById('screenshotArea');
            const stamp = document.getElementById('ssTimestamp');
            stamp.innerText = "BILL DATE: " + new Date().toLocaleString('en-IN').toUpperCase();

            // താൽക്കാലികമായി സ്ക്രോൾ ഒഴിവാക്കി മുഴുവൻ കണ്ടന്റും കാണിക്കുന്നു
            const originalHeight = area.style.height;
            const originalOverflow = area.style.overflow;
            area.style.height = 'auto';
            area.style.overflow = 'visible';

            try {
                const canvas = await html2canvas(area, {
                    scale: 3, // കൂടുതൽ ക്ലിയർ ആകാൻ
                    backgroundColor: "#ffffff",
                    useCORS: true,
                    logging: false,
                    scrollY: -window.scrollY // സ്ക്രോൾ ചെയ്ത പൊസിഷൻ അഡ്ജസ്റ്റ് ചെയ്യാൻ
                });

                const link = document.createElement('a');
                link.download = `Kochachan_Bill_${Date.now()}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            } catch (err) {
                console.error("Screenshot Error:", err);
                alert("Failed to save bill image.");
            } finally {
                area.style.height = originalHeight;
                area.style.overflow = originalOverflow;
            }
        }

        function sendWhatsAppOrder() {
            if(cart.length === 0) return alert("Cart is empty!");
            let message = "🛒 *KOCHACHAN VEG & FRUITS ORDER*\n━━━━━━━━━━━━━━━━━━\n";
            cart.forEach((item, index) => {
                message += `${index + 1}. *${item.name}*\n   ${item.qty}kg x ₹${item.price} = *₹${item.total.toFixed(2)}*\n`;
            });
            message += "━━━━━━━━━━━━━━━━━━\n";
            message += `💰 *TOTAL BILL: ₹${document.getElementById('sideTotal').innerText}*\n`;
            message += `📅 ${new Date().toLocaleString('en-IN')}`;
            window.open(`https://wa.me/918589944310?text=${encodeURIComponent(message)}`, '_blank');
        }

        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        function toggleCart() { document.getElementById('cartSidebar').classList.toggle('show-cart'); }
        function setQty(v) { document.getElementById('qtyInput').value = v; }
        function closeQtyModal() { document.getElementById('qtyModal').style.display = 'none'; }

        function openQtyModal(i) {
            selectedVeg = vegetables[i];
            document.getElementById('qtyTitle').innerText = selectedVeg.name;
            document.getElementById('qtyTitleML').innerText = selectedVeg.name_ml;
            document.getElementById('qtyImgContainer').innerHTML = `<div class="text-6xl">${selectedVeg.image}</div>`;
            document.getElementById('qtyInput').value = 1;
            document.getElementById('qtyModal').style.display = 'flex';
        }

        function confirmAddToCart() {
            const q = parseFloat(document.getElementById('qtyInput').value);
            if(q > 0) {
                cart.push({ 
                    name: selectedVeg.name_ml, 
                    price: selectedVeg.price, 
                    qty: q, 
                    total: selectedVeg.price * q 
                });
                updateCartUI(); 
                closeQtyModal();
            }
        }
        
        function clearCart() { if(confirm("Clear current bill?")) { cart = []; updateCartUI(); } }

        function filterVeg() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('vegContainer');
            const items = container.children;
            vegetables.forEach((v, i) => {
                const match = v.name.toLowerCase().includes(q) || v.name_ml.toLowerCase().includes(q);
                if(items[i]) items[i].style.display = match ? 'flex' : 'none';
            });
        }

        setInterval(() => { 
            document.getElementById('liveTime').innerText = new Date().toLocaleString('en-IN', { timeStyle: 'medium', dateStyle: 'medium' }); 
        }, 1000);

        renderList();
    </script>
</body>
                    </html>
